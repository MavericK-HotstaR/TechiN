<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Honey 🍯</title>
<style>
:root{--navy:#063b72;--blue:#087ee8;--sky:#7de7ff;--gold:#ffd66b;--cream:#fff8e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:white}
body{min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#0588e8 0%,#27c5ef 42%,#07539b 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 12%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 80% 22%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 60% 70%,#fff6 0 2px,transparent 3px);background-size:95px 83px,123px 117px,150px 130px;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.45}}
.scene{display:none;min-height:100vh;position:relative;isolation:isolate;align-items:center;justify-content:center;padding:28px 16px;overflow:hidden}
.scene.active{display:flex;animation:appear .75s ease both}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ocean{position:absolute;z-index:-2;left:-10%;right:-10%;bottom:-10px;height:36%;background:linear-gradient(180deg,#29d5ee,#0876c9 50%,#064780);border-radius:50% 50% 0 0/18% 18% 0 0}
.ocean:before{content:"";position:absolute;inset:15% 0 auto;height:12px;background:linear-gradient(90deg,transparent,#ffffffa6,transparent,#ffffff88,transparent);filter:blur(4px);animation:wave 5s linear infinite}
@keyframes wave{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.bubble{position:absolute;border:1px solid #ffffff8a;border-radius:50%;background:#c6faff25;animation:float 7s ease-in-out infinite}
.b1{width:34px;height:34px;left:8%;top:20%}.b2{width:18px;height:18px;right:13%;top:30%;animation-delay:-2s}.b3{width:48px;height:48px;right:8%;bottom:20%;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-25px) translateX(8px)}}
h1{font-size:clamp(2rem,6vw,4.5rem);line-height:1.05;margin:0 0 16px;text-align:center;text-shadow:0 4px 0 #0757a8,0 0 25px #c5f7ff;letter-spacing:.02em}
h1 .honey{color:#ffdf72;-webkit-text-stroke:1px #a85a08;text-shadow:0 4px 0 #a85a08,0 0 20px #fff3a3}
.subtitle{font-size:1.05rem;color:#eafcff;text-align:center;margin:0 0 22px}
.card{width:min(700px,100%);text-align:center;position:relative;z-index:2}
.envelope-wrap{margin:20px auto 26px;width:min(290px,75vw);height:190px;position:relative;cursor:pointer;filter:drop-shadow(0 16px 18px #003b7766);transition:transform .3s}
.envelope-wrap:hover{transform:translateY(-7px) rotate(-1deg)}
.envelope{position:absolute;inset:35px 0 0;background:linear-gradient(145deg,#fffef5,#c7f5ff);border-radius:12px;overflow:hidden;border:3px solid white}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 49%,#87dfff 50%,transparent 51%),linear-gradient(215deg,transparent 49%,#b7eaff 50%,transparent 51%)}
.flap{position:absolute;top:35px;left:0;width:100%;height:100px;background:linear-gradient(160deg,#fff,#b5ecff);clip-path:polygon(0 0,100% 0,50% 75%);z-index:2;border-radius:8px}
.seal{position:absolute;z-index:3;top:85px;left:50%;transform:translateX(-50%);font-size:42px;filter:drop-shadow(0 3px 3px #976015)}
.tap{display:inline-flex;align-items:center;gap:10px;border:2px solid #b9f5ff;border-radius:999px;padding:13px 24px;font-size:1rem;font-weight:800;color:white;background:linear-gradient(135deg,#159cff,#0757d8);box-shadow:0 0 0 4px #ffffff26,0 8px 0 #03458c,0 0 24px #9af4ff8c;cursor:pointer;transition:transform .15s,filter .15s}
.tap:hover{filter:brightness(1.12);transform:translateY(-2px)}.tap:active{transform:translateY(4px);box-shadow:0 0 0 4px #ffffff26,0 3px 0 #03458c}
.small{font-size:.88rem;padding:10px 16px}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.cake-area{position:relative;width:min(420px,90vw);height:330px;margin:8px auto 0;display:flex;align-items:flex-end;justify-content:center}
.plate{position:absolute;bottom:18px;width:100%;height:32px;border-radius:50%;background:linear-gradient(#fff,#8cecff 40%,#1678c2);box-shadow:0 12px 22px #003c7c75}
.cake{position:absolute;bottom:36px;width:82%;height:190px}
.tier{position:absolute;border-radius:18px 18px 15px 15px;border:3px solid #fff6;box-shadow:inset 0 -13px 0 #075bb844,0 8px 10px #004a7a38}
.tier.bottom{bottom:0;left:0;width:100%;height:86px;background:linear-gradient(120deg,#35d9ef,#0788dd 65%,#45dff3)}
.tier.middle{bottom:76px;left:12%;width:76%;height:65px;background:linear-gradient(120deg,#fff3c9,#ffca70 70%,#fff0b0)}
.tier.top{bottom:132px;left:25%;width:50%;height:52px;background:linear-gradient(120deg,#e8ffff,#7ce9f5 70%,#dfffff)}
.drip{position:absolute;top:12px;left:8%;width:84%;height:18px;border-radius:0 0 50% 50%;background:#fff4c8;box-shadow:0 8px 0 -3px #fff4c8}
.bottom .drip{background:#ffe49b;box-shadow:0 8px 0 -3px #ffe49b}
.berry{position:absolute;font-size:21px;top:5px;filter:drop-shadow(0 2px 2px #944)}
.candle{position:absolute;z-index:4;bottom:181px;left:calc(50% - 6px)!important;width:12px;height:49px;border-radius:4px;background:repeating-linear-gradient(135deg,#fff 0 7px,#ff75b9 7px 13px);box-shadow:0 0 5px #fff}

.flame{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:15px;height:24px;background:radial-gradient(ellipse at 50% 70%,#fffbd1 0 20%,#ffe45b 40%,#ff851f 70%,transparent 73%);border-radius:50% 50% 50% 0;rotate:-8deg;filter:drop-shadow(0 0 9px #ffdb50);animation:flicker .15s infinite alternate}
@keyframes flicker{to{transform:translateX(-50%) scale(.85) rotate(8deg)}}
.cake-label{position:absolute;z-index:3;bottom:48px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:900;color:#075a9e;text-shadow:0 1px white;white-space:nowrap}
.popover{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#001c3dc9;backdrop-filter:blur(7px)}
.popover.show{display:flex;animation:appear .3s ease}
.message{width:min(540px,100%);position:relative;padding:32px 24px 24px;border-radius:26px;color:#124b79;background:linear-gradient(145deg,#fffef2,#d9f8ff);border:4px solid #fff;box-shadow:0 0 0 3px #75ddff,0 20px 65px #00152e99;text-align:center}
.message:before{content:"🍯 🐝 🐚";display:block;font-size:25px;margin-bottom:10px}
.message h2{margin:0 0 15px;color:#0873c7;font-size:1.65rem}
.message p{font-size:clamp(1rem,3.5vw,1.22rem);font-weight:700;line-height:1.9;margin:0 0 20px;white-space:pre-line}
.close{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:36px;height:36px;font-size:22px;font-weight:900;color:#fff;background:#087ee8;cursor:pointer;box-shadow:0 3px 0 #07529b}
.balloon{position:fixed;z-index:10;bottom:-130px;width:48px;height:62px;border-radius:50% 50% 46% 46%;background:var(--balloon);box-shadow:inset -8px -7px 0 #001d3020,inset 8px 6px 0 #ffffff5a;animation:balloonUp var(--duration,5s) ease-in forwards;pointer-events:none}
.balloon:before{content:"";position:absolute;bottom:-7px;left:21px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--balloon)}
.balloon:after{content:"";position:absolute;top:66px;left:24px;width:1px;height:70px;background:#ffffffaa}
@keyframes balloonUp{0%{transform:translateY(0) rotate(-7deg);opacity:0}10%{opacity:1}100%{transform:translateY(-120vh) rotate(12deg);opacity:0}}
.spark{position:fixed;z-index:15;width:5px;height:5px;border-radius:50%;pointer-events:none;background:#fff6a8;box-shadow:0 0 10px 3px #ffb833,0 0 22px 6px #ff6a9b;animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.footer{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.75rem;color:#e0fbffb8}
@media(max-width:430px){.cake-area{height:290px}.cake{height:150px}.candle{bottom:150px}.cake-label{bottom:45px}.scene{padding:22px 13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section class="scene active" id="welcome">
  <div class="ocean"></div><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i>
  <div class="card">
    <p class="subtitle"></p>
    <h1>HAPPY BIRTHDAY TO<br><span class="honey">HONEY 🍯</span></h1>
    <p class="subtitle"></p>
    <div class="envelope-wrap" role="button" tabindex="0" aria-label="เปิดจดหมาย" onclick="openLetter()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLetter()}">
      <div class="envelope"></div><div class="flap"></div><div class="seal">🍯</div>
    </div>
    <button class="tap" onclick="openLetter()">✉️ กดเปิดจดหมาย</button>
  </div>
  <div class="footer">Made with love, sunshine & a little honey ✨</div>
</section>

<section class="scene" id="celebrate">
  <div class="ocean"></div><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i>
  <div class="card">
    <p class="subtitle"></p>
    <h1>HAPPY BIRTHDAY TO<br><span class="honey">HONEY 🍯</span></h1>
    <p class="subtitle"></p>
    <div class="cake-area" aria-label="เค้กวันเกิดสามชั้นพร้อมเทียนหนึ่งเล่มตรงกลาง">
      <div class="plate"></div>
      <div class="cake">
        <div class="tier bottom"><div class="drip"></div><span class="berry" style="left:12%">🍓</span><span class="berry" style="left:39%">🌼</span><span class="berry" style="left:70%">🍓</span><span class="berry" style="left:84%">🌼</span></div>
        <div class="tier middle"><div class="drip"></div><span class="berry" style="left:15%">🌼</span><span class="berry" style="left:43%">🍯</span><span class="berry" style="left:76%">🌼</span></div>
        <div class="tier top"><div class="drip"></div><span class="berry" style="left:20%">💙</span><span class="berry" style="left:65%">💛</span></div>
        <div class="candle"><span class="flame"></span></div>
      </div>
      <div class="cake-label">Sweet Honey 🍯</div>
    </div>
    <div class="controls">
      <button class="tap" id="blowBtn" onclick="blowCandles()">🌬️ กดเป่าเทียน</button>
      <button class="tap" onclick="celebrate()">🎈 กดเพื่อเอฟเฟกต์</button>
    </div>
  </div>
  <div class="footer">Make a wish, Honey! ⭐</div>
</section>

<div class="popover" id="wish" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
  <div class="message">
    <button class="close" aria-label="ปิดหน้าต่าง" onclick="closeWish()">×</button>
    <h2 id="wishTitle">คำอวยพร</h2>
    <p>สุขสันต์วันเกิดนะพี่ ขอให้มีความสุข กายใจแข็งแรง สมหวังในสิ่งที่ตั้งใจไว้ทุกอย่างเลย อย่าหากินเหล้าหลาย🍺</p>
    <button class="tap small" onclick="closeWish()">💙 ปิดคำอวยพร</button>
  </div>
</div>
<script>
function openLetter(){
  const letter=document.querySelector('.envelope-wrap');
  letter.style.transform='scale(1.12) rotate(4deg)';
  letter.style.opacity='.25';
  setTimeout(()=>{
    document.getElementById('welcome').classList.remove('active');
    document.getElementById('celebrate').classList.add('active');
    letter.style.transform='';letter.style.opacity='1';
    celebrate();
  },380);
}
function blowCandles(){
  document.querySelectorAll('.flame').forEach(f=>{f.style.display='none'});
  document.getElementById('blowBtn').textContent='✨ เป่าเทียนแล้ว!';
  fireworks();
  setTimeout(()=>{document.getElementById('wish').classList.add('show');},500);
}
function closeWish(){document.getElementById('wish').classList.remove('show')}
document.getElementById('wish').addEventListener('click',e=>{if(e.target.id==='wish')closeWish()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWish()});
function celebrate(){
  const colors=['#ff6b9d','#ffd166','#68e7ff','#a78bfa','#ff9950'];
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const b=document.createElement('div');b.className='balloon';
      b.style.left=(8+Math.random()*82)+'vw';b.style.setProperty('--balloon',colors[i]);
      b.style.setProperty('--duration',(4.4+Math.random()*2.4)+'s');
      b.style.transform='scale('+(0.8+Math.random()*.5)+')';
      document.body.appendChild(b);setTimeout(()=>b.remove(),7500);
    },i*180);
  }
}
function fireworks(){
  for(let burst=0;burst<7;burst++){
    setTimeout(()=>{
      const x=10+Math.random()*80,y=10+Math.random()*55;
      for(let i=0;i<28;i++){
        const s=document.createElement('i');s.className='spark';
        s.style.left=x+'vw';s.style.top=y+'vh';
        const a=(Math.PI*2*i)/28,r=45+Math.random()*95;
        s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');
        document.body.appendChild(s);setTimeout(()=>s.remove(),1400);
      }
    },burst*250);
  }
  celebrate();
}
</script>
</body>
</html>
